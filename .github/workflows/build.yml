name: Build Orage

on:
  push:
  pull_request:
  workflow_dispatch:      # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write      # necessaire pour publier la Release

jobs:
  tests:                 # tests automatiques (moteur, filtres, effets, arpegiateur) : environ 1 minute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Foudre-Core (code commun, meme commit que CMakeLists.txt)
        run: |
          tag=$(grep -A3 'FetchContent_Declare(FoudreCore' CMakeLists.txt | grep GIT_TAG | awk '{print $2}' | tr -d ')')
          git clone -q https://github.com/anthonyangelierleplan-design/Foudre-core.git "$RUNNER_TEMP/foudre-core"
          git -C "$RUNNER_TEMP/foudre-core" checkout -q "$tag"
          echo "FOUDRE_CORE=$RUNNER_TEMP/foudre-core" >> "$GITHUB_ENV"
      - name: Tests sans JUCE
        run: bash tools/tests/run.sh

  windows:
    needs: tests         # pas de build ni de Release si un test echoue
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Orage + Orage FX)
        uses: actions/upload-artifact@v4
        with:
          name: Orage-VST3-Windows
          path: |
            build/Orage_artefacts/Release/VST3/
            build/OrageSynth_artefacts/Release/VST3/

      - name: Upload Standalone (pour tester sans Ableton)
        uses: actions/upload-artifact@v4
        with:
          name: Orage-Standalone-Windows
          path: |
            build/Orage_artefacts/Release/Standalone/
            build/OrageSynth_artefacts/Release/Standalone/

      - name: Zip VST3 pour la Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/Orage_artefacts/Release/VST3/*, build/OrageSynth_artefacts/Release/VST3/* -DestinationPath release/Orage-VST3-Windows.zip -Force

      - name: Publier la Release "latest" (lien de telechargement direct)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest release/Orage-VST3-Windows.zip --title "Derniere version (build ${{ github.run_number }})" --notes "Build automatique du commit ${{ github.sha }}. Dezipper et copier le dossier .vst3 dans C:\Program Files\Common Files\VST3"
