name: Build Orage

on:
  push:
  pull_request:
  workflow_dispatch:      # bouton "Run workflow" dans l'onglet Actions

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Orage + Orage FX)
        uses: actions/upload-artifact@v4
        with:
          name: Orage-VST3-Windows
          path: |
            build/Orage_artefacts/Release/VST3/
            build/OrageSynth_artefacts/Release/VST3/

      - name: Upload Standalone (pour tester sans Ableton)
        uses: actions/upload-artifact@v4
        with:
          name: Orage-Standalone-Windows
          path: |
            build/Orage_artefacts/Release/Standalone/
            build/OrageSynth_artefacts/Release/Standalone/
